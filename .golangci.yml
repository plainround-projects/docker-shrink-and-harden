version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
    - bodyclose
    - noctx
    - nilerr
    - predeclared
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
formatters:
  enable:
    - gofmt
    - goimports
